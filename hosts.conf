# ═══════════════════════════════════════════════════════════
#  إعدادات هوستات Spyro TV — عدّل هذا الملف فقط ثم احفظ (Commit)
#  بعد الحفظ ينشر GitHub الملف تلقائياً خلال دقيقة تقريباً.
#  الصيغة:  المفتاح = القيمة     (السطر الذي يبدأ بـ # تعليق)
#  القيمة الفارغة مسموحة. لا تضع علامات اقتباس.
# ═══════════════════════════════════════════════════════════

# ── الإيقاف الشامل ──────────────────────────────────────────
# off = يوقف السيرفرات 1 و2 و3 كلها فوراً (لمن يسجّل دخولاً بعد ذلك).
# on  = كل سيرفر حسب إعداداته أدناه.
global = on
# رسالة تظهر للمستخدم أثناء الإيقاف الشامل (اتركها فارغة لتظهر رسالة كل سيرفر أو الافتراضية). حتى 200 حرف.
global_message =

# ── السيرفرات ───────────────────────────────────────────────
# serverN        = عنوان الهوست، مثل http://example.com:8080  (بلا اسم مستخدم/كلمة سر، فالملف علني)
# serverN_on     = on يعمل / off متوقف (العنوان يبقى محفوظاً هنا)
# serverN_message = رسالة الإيقاف لهذا السيرفر (اختياري، حتى 200 حرف)
# serverN_monitor = on يفحص الفحص الدوري هذا السيرفر ويُنبّهك إن سقط؛ off لسيرفر يمنع طلبات فحص مصدرها GitHub.
# لحذف سيرفر: امسح عنوانه.   لتغييره: بدّل العنوان — الحسابات المحفوظة تتبع الرقم تلقائياً.
server1 =
server1_on = on
server1_message =
server1_monitor = on

server2 =
server2_on = on
server2_message =
server2_monitor = on

server3 =
server3_on = on
server3_message =
server3_monitor = on

# ── الإعلان (نافذة تظهر للمستخدم) ───────────────────────────
# اترك العنوان والنص والصورة فارغة لإلغاء الإعلان.
notice_title =
notice =
notice_button =
# روابط https فقط:
notice_url =
notice_image =
# آخر يوم يظهر فيه الإعلان بصيغة 2026-12-31 (بتوقيت السعودية). فارغ = بلا انتهاء.
notice_until =
# on = يظهر في كل تشغيل، off = مرة واحدة لكل محتوى
notice_every_launch = off

# ── فرض التحديث ─────────────────────────────────────────────
# app_version_code = رقم versionCode لآخر نسخة نشرتها فعلاً (الحالي 11). حدّثه مع كل إصدار.
# min_version      = أي نسخة أقل منه تُحجب بنافذة تحديث. 0 = بلا حد. ممنوع أن يزيد عن app_version_code.
app_version_code = 11
min_version = 0
# رابط تنزيل الـ APK (https)، مثل رابط GitHub Releases:
update_url =

# ── التجديد عبر واتساب ──────────────────────────────────────
# إن تركت الرقم فارغاً يستعمل التطبيق رقمه المضمَّن ويبقى التجديد مفعَّلاً.
# لإطفاء التجديد: ضع رقماً واكتب whatsapp = off.
whatsapp = on
whatsapp_number =
whatsapp_days = 30
