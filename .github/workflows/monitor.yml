name: monitor-hosts

# كل 30 دقيقة: يفحص وصول الهوستات المفعَّلة وينشئ Issue (تنبيه على جوالك) إن سقط أحدها، ويغلقه عند عودته.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hosts-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe hosts and alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/monitor.py
